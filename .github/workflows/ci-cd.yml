name: python application ci-cd

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v2

      - name: Build the Docker image
        run: docker build . --file app.dockerfile --tag ghcr.io/${{ github.repository_owner }}/GitHub_Actions:${{ github.sha }}

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@<commit-SHA>
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/GitHub_Actions:latest
          severity: HIGH,CRITICAL         # Report only HIGH and CRITICAL vulnerabilities
          format: table                   # Output vulnerabilities in table format
          ignore-unfixed: true            # Ignore unfixed vulnerabilities (optional)


      - name: Performance Test
        uses: ./.github/actions/performance-test
        with:
          endpoint: http://localhost:8080

  deploy:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Docker Container
        run: docker run --name python-app -d -p 8080:8080 ghcr.io/${{ github.repository_owner }}/GitHub_Actions:latest

      - name: Verify Deployment
        run: curl --fail http://localhost:8080 || exit 1
